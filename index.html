<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Build a realistic study routine from your goals and available time."><title>Study Plan Chatbot</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="wrap"><small>Standalone demo app</small><h1>Study Plan Chatbot</h1><p>Build a realistic study routine from your goals and available time.</p></div></header><main class="main"><section class="panel"><h2>Your study plan</h2><label for="input">What would you like help with?</label><textarea id="input" placeholder="Example: Biology exam in 3 weeks, 1 hour each weekday, focus on genetics."></textarea><button onclick="run()">Build my plan</button><div id="result" class="result" aria-live="polite"></div></section><footer>Runs locally in your browser. Demo content is generated from your input and is not a substitute for verified or professional advice.</footer></main><script>function out(html){document.querySelector('#result').innerHTML=html}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function run(){let q=document.querySelector('#input').value.trim();if(!q){out('Describe your subject, deadline, and study time.');return}let days=(q.match(/(\d+)\s*(?:day|week)/i));let total=days?Math.min(28,(+days[1])*(/week/i.test(days[0])?7:1)):14;let subjects=q.split(/[,.]/).map(x=>x.trim()).filter(Boolean);let checkpoints=['Review core concepts','Practice active recall','Work through problems','Review mistakes and weak areas','Take a short self-check'];let html=`<h3>${esc(subjects[0]||'Personalized')} · ${total}-day starter plan</h3><p>Schedule 1 focused session per day. Adjust duration to the time you have.</p>`;for(let d=1;d<=Math.min(total,10);d++)html+=`<label class="task"><input type="checkbox" onchange="saveChecks()"><span><b>Day ${d}:</b> ${checkpoints[(d-1)%checkpoints.length]}${subjects[1]?` — ${esc(subjects[1])}`:''}<small>25 min focus + 5 min break</small></span></label>`;html+='<p class="muted">After each session, note what felt difficult and use that to adjust tomorrow.</p>';out(html)}function saveChecks(){}</script></body></html>
